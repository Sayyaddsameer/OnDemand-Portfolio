<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="60%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cdnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <circle cx="200" cy="80" r="130" fill="#ec4899" opacity="0.12" filter="url(#glow2)"/>
  <circle cx="650" cy="350" r="150" fill="#8b5cf6" opacity="0.12" filter="url(#glow2)"/>

  <!-- Architecture Flow -->
  <g transform="translate(80, 85)">
    <!-- Edge / CloudFront Box -->
    <rect x="20" y="30" width="160" height="100" rx="14" fill="#1f2937" stroke="#ec4899" stroke-width="2.5" filter="url(#glow2)"/>
    <text x="100" y="72" fill="#f472b6" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">CloudFront Edge</text>
    <text x="100" y="95" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">ETag / 304 Cache</text>
    <text x="100" y="113" fill="#9ca3af" font-family="Inter, sans-serif" font-size="10" text-anchor="middle">Locust Load-Tested</text>

    <!-- Arrow with Secret Header -->
    <path d="M 180 80 L 260 80" stroke="url(#cdnGrad)" stroke-width="4"/>
    <rect x="185" y="55" width="70" height="20" rx="4" fill="#374151"/>
    <text x="220" y="69" fill="#f9a8d4" font-family="monospace" font-size="9" text-anchor="middle">X-CDN-Secret</text>

    <!-- Origin Shield / FastAPI Box -->
    <rect x="260" y="20" width="170" height="120" rx="14" fill="#1f2937" stroke="#8b5cf6" stroke-width="2.5" filter="url(#glow2)"/>
    <text x="345" y="62" fill="#c084fc" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Origin Shield</text>
    <text x="345" y="86" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="13" font-weight="600" text-anchor="middle">FastAPI Middleware</text>
    <text x="345" y="108" fill="#10b981" font-family="Inter, sans-serif" font-size="11" text-anchor="middle">Auth Verified 🛡️</text>

    <!-- Arrow -->
    <path d="M 430 80 L 500 80" stroke="url(#cdnGrad)" stroke-width="4"/>

    <!-- DB Storage Box -->
    <rect x="500" y="30" width="140" height="100" rx="14" fill="#1f2937" stroke="#06b6d4" stroke-width="2"/>
    <text x="570" y="72" fill="#38bdf8" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle">S3 / asyncpg</text>
    <text x="570" y="95" fill="#e5e7eb" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Connection Pool</text>
  </g>

  <!-- Metric Pill -->
  <g transform="translate(400, 275)">
    <rect x="-190" y="0" width="380" height="42" rx="21" fill="#1f2937" stroke="#ec4899" stroke-width="1.5"/>
    <text x="0" y="26" fill="#f472b6" font-family="Inter, sans-serif" font-size="14" font-weight="600" text-anchor="middle">⚡ Zero Unauthorized Origin Bypass</text>
  </g>

  <!-- Titles -->
  <text x="400" y="375" fill="#f8fafc" font-family="Inter, sans-serif" font-size="28" font-weight="800" text-anchor="middle">Content Delivery &amp; Origin Shield API</text>
  <text x="400" y="405" fill="#9ca3af" font-family="Inter, sans-serif" font-size="14" font-weight="500" text-anchor="middle">FastAPI · CloudFront · ETag/304 Caching · asyncpg Pooling · Locust</text>
</svg>
